services:
  jellyfin:
    image: jellyfin/jellyfin:12
    container_name: jellyfin
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "7359:7359/udp"
    environment:
      TZ: "${TZ:-UTC}"
      JELLYFIN_PublishedServerUrl: "http://192.168.X.X:8096"
    volumes:
      - /home/your-username/jellyfin/config:/config
      - /home/your-username/jellyfin/cache:/cache
      - /mnt/storage/movies:/media/movies:ro
      - /mnt/storage/shows:/media/shows:ro
